<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寺院檀家管理システム</title>
  <style>
    :root {
      --primary-color: #92400e;
      --primary-light: #fef3c7;
      --text-main: #1e293b;
      --text-muted: #475569;
      --text-subtle: #64748b;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --link-color: #2563eb;
      --link-hover: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", Meiryo, sans-serif;
      line-height: 1.85;
      color: var(--text-main);
      background-color: var(--bg-page);
      margin: 0;
      padding: 40px 20px 60px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      background: var(--bg-card);
      padding: 48px 44px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--primary-color);
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.02);
    }

    .site-badge {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-color);
      background-color: var(--primary-light);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      text-decoration: none;
    }

    .site-badge:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 18px;
      margin-top: 0;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    h1 a {
      color: #0f172a;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    h1 a:hover {
      color: var(--primary-color);
      text-decoration: underline;
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      margin-top: 36px;
      margin-bottom: 16px;
      color: #0f172a;
      border-left: 4px solid var(--primary-color);
      padding-left: 14px;
      padding-top: 2px;
      padding-bottom: 2px;
      background: linear-gradient(90deg, #fffbeb 0%, transparent 100%);
      border-radius: 0 4px 4px 0;
    }

    p {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 18px;
    }

    ul {
      padding-left: 22px;
      margin-top: 0;
      margin-bottom: 24px;
    }

    li {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.8;
    }

    strong {
      color: #0f172a;
      font-weight: 600;
    }

    a {
      color: var(--link-color);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--link-hover);
    }

    .links {
      margin-top: 40px;
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }

    .links a {
      margin-right: 0;
      color: var(--primary-color);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      padding: 8px 16px;
      background-color: #fef3c7;
      border-radius: 6px;
      border: 1px solid #fde68a;
      transition: all 0.15s ease;
    }

    .links a:hover {
      background-color: #fde68a;
      text-decoration: none;
      transform: translateY(-1px);
    }

    .footer-nav {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 14px;
    }

    .footer-links a {
      color: var(--text-subtle);
      text-decoration: none;
      font-weight: 500;
      background: none;
      padding: 0;
      border: none;
    }

    .footer-links a:hover {
      color: var(--primary-color);
      text-decoration: underline;
      transform: none;
    }

    .footer-links a.active {
      color: var(--primary-color);
      font-weight: 700;
    }

    .footer-copy {
      font-size: 12px;
      color: #94a3b8;
    }

    @media (max-width: 640px) {
      body {
        padding: 20px 12px;
      }
      .container {
        padding: 28px 20px;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 16px;
      }
      .footer-nav {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="about.html" class="site-badge">寺院檀家管理システム</a>
    <h1><a href="https://henjoukongou.com/">寺院檀家管理システム</a></h1>
    <p>「寺院檀家管理システム」は、寺院業務における檀家台帳、過去帳、年中行事、会計等の管理を円滑に行うためのWebアプリケーションです。</p>
    <h2>本アプリの目的・主な機能</h2>
    <ul>
      <li><strong>檀家・過去帳管理:</strong> 檀家情報や過去帳、年忌法要の期日を正確に一元管理します。</li>
      <li><strong>Googleスプレッドシート連携:</strong> ユーザーご自身のGoogleスプレッドシートと安全に連携し、台帳データの自動バックアップおよび複数人での共有を実現します。</li>
    </ul>
    <div class="links">
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="term.html">利用規約</a>
    </div>

    <div class="footer-nav">
      <div class="footer-links">
        <a href="about.html" class="active">システムについて</a>
        <a href="term.html">利用規約</a>
        <a href="privacy.html">プライバシーポリシー</a>
      </div>
      <div class="footer-copy">© 寺院檀家管理システム</div>
    </div>
  </div>
</body>
</html>
