name: Check bug fixes

on:
  pull_request:
  push:
    branches: ["fix/data-safety-and-toba-sync"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
